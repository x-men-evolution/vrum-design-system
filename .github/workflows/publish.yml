name: Publish packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@x-men-evolution'

      - run: npm ci

      - run: npm run build

      - name: Publish
        run: |
          for pkg in design-tokens web-ui native-ui; do
            npm publish --workspace packages/$pkg
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
